databases:
  - name: ls-db
    plan: free
    databaseName: ls
    user: ls
services:
  - type: web
    name: linksentinel-api
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - {key: DATABASE_URL, fromDatabase: {name: ls-db, property: connectionString}}
      - {key: JWT_SECRET, generateValue: true}
      - {key: IP_SALT, generateValue: true}
      - {key: INLINE_AGENTS, value: "true"}
      - {key: REDIS_URL, sync: false}
      - {key: GROQ_API_KEY, sync: false}
      - {key: GEMINI_API_KEY, sync: false}
      - {key: CORS_ORIGINS, sync: false}
