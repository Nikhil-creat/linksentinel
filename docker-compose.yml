services:
  db:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: ls, POSTGRES_PASSWORD: "${DB_PASSWORD}", POSTGRES_DB: ls}
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U ls"], interval: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 5s, retries: 10}
  api:
    build: .
    env_file: .env
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
    ports: ["8000:8000"]
  worker:
    build: .
    command: celery -A app.workers.tasks worker -l info
    env_file: .env
    depends_on: [api]
  web:
    image: nginx:alpine
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
    ports: ["8080:80"]
volumes: {pg: {}}
